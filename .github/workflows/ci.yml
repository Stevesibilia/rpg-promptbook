name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: registry.access.redhat.com/hi/postgresql:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The server's esbuild bundle, as the image builds it.
      - run: npm run build -w promptbook-server
      - run: npm test
        env:
          # The server's database tests recreate this database on every run.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/promptbook_test
      - name: Prettier on changed Markdown
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.md' > changed-md.txt
          if [ -s changed-md.txt ]; then
            xargs -d '\n' npx --yes prettier@3 --check < changed-md.txt
          else
            echo "No Markdown files changed."
          fi

  # The Helm chart, rendered with each values file, so a broken template shows
  # on the pull request rather than on a release tag (design decision 5). Not a
  # required check yet.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - run: helm lint charts/rpg-promptbook
      - run: helm lint charts/rpg-promptbook -f charts/rpg-promptbook/values-homelab.yaml
      - run: helm template rpg-promptbook charts/rpg-promptbook --set image.tag=ci > /dev/null
      - run: helm template rpg-promptbook charts/rpg-promptbook -f charts/rpg-promptbook/values-homelab.yaml --set image.tag=ci > /dev/null

  # The end-to-end tests against the compose stack (design decision 11), the
  # desktop app's among them. Not a required check until the owner says so.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The desktop project runs the unpackaged app from these builds.
      - run: npm run build -w promptbook-web
      - run: npm run build -w promptbook-desktop
      # Ubuntu's AppArmor refuses the unprivileged user namespaces Electron's
      # renderer sandbox needs (on images that have the setting).
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Electron needs a display: xvfb-run gives it one.
      - run: xvfb-run -a npm run e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
