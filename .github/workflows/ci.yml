name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prettier on changed Markdown
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.md' > changed-md.txt
          if [ -s changed-md.txt ]; then
            xargs -d '\n' npx --yes prettier@3 --check < changed-md.txt
          else
            echo "No Markdown files changed."
          fi
