name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The server's esbuild bundle, as the image builds it.
      - run: npm run build -w promptbook-server
      - run: npm test
        env:
          # The server's database tests recreate this database on every run.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/promptbook_test
      - name: Prettier on changed Markdown
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.md' > changed-md.txt
          if [ -s changed-md.txt ]; then
            xargs -d '\n' npx --yes prettier@3 --check < changed-md.txt
          else
            echo "No Markdown files changed."
          fi
