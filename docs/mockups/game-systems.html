<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game systems mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Mockup only. Chrome, settings, editor document and modal copied from
   licence.html (tokens.css, settings.css, editor.css, ui/modal.css). The
   rules marked NEW are the template editor. */
:root {
  --bg: #eef1ef; --surface: #ffffff; --surface-2: #f6f8f7; --hover: #eaefec;
  --border: #d3dbd7; --text: #17201c; --muted: #5b6862; --faint: #8b9690;
  --primary: #0f8f69; --primary-hover: #0c7a59; --on-primary: #ffffff;
  --amber: #b9740a; --danger: #d42a3c; --info: #2f6fd1; --note: #7a3fc4;
  --leggi: rgba(15,143,105,.08); --leggi-line: #0f8f69;
  --radius: 6px;
  --font: 'Barlow', system-ui, sans-serif;
  --display: 'Barlow Condensed', 'Barlow', sans-serif;
  --prose: 'Spectral', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131917; --surface: #1a221f; --surface-2: #202a26; --hover: #232d29;
    --border: #33403a; --text: #e7ece9; --muted: #97a49d; --faint: #6b7972;
    --primary: #1fb98a; --primary-hover: #2fcb9b; --on-primary: #08150f;
    --amber: #f5a623; --danger: #ff5a6a; --info: #6aa8ff; --note: #c08cff;
    --leggi: rgba(31,185,138,.10); --leggi-line: #1fb98a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131917; --surface: #1a221f; --surface-2: #202a26; --hover: #232d29;
  --border: #33403a; --text: #e7ece9; --muted: #97a49d; --faint: #6b7972;
  --primary: #1fb98a; --primary-hover: #2fcb9b; --on-primary: #08150f;
  --amber: #f5a623; --danger: #ff5a6a; --info: #6aa8ff; --note: #c08cff;
  --leggi: rgba(31,185,138,.10); --leggi-line: #1fb98a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
a { color: var(--primary); }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 9px; }
input:focus, select:focus { outline: none; border-color: var(--primary); }
code { font: .92em var(--mono); }
.spacer { flex: 1; }

/* Mockup controls (not part of the app) */
.mock { height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 10px; font-size: 12px; white-space: nowrap; overflow-x: auto;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--note) 10%, var(--bg)) 0 8px, var(--bg) 8px 16px);
  border-bottom: 1px dashed var(--note); color: var(--muted); }
.mock .lab { font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--note); margin-right: 8px; }
.mock button { padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; flex: none; }
.mock button:hover { border-color: var(--border); color: var(--text); }
.mock button.on { border-color: var(--note); color: var(--note); background: var(--surface); }
.mock button:disabled { opacity: .4; cursor: default; }
.mock .sep { width: 1px; height: 16px; background: var(--border); margin: 0 6px; flex: none; }

.app { display: grid; height: calc(100vh - 34px); grid-template-rows: 44px 1fr 26px; grid-template-columns: 48px 1fr; }

/* Top bar */
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 0;
  background: var(--surface); border-bottom: 1px solid var(--border); min-width: 0; }
.logo { width: 48px; display: grid; place-items: center; font: 700 18px var(--display); color: var(--primary); flex: none; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; min-width: 0; overflow: hidden; }
.crumbs b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.top-meta { display: flex; align-items: center; gap: 8px; flex: none; }
.top-meta select { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); flex: none; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.tb { padding: 5px 9px; border-radius: var(--radius); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; text-decoration: none; }
.tb:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.tb.line { border: 1px solid var(--border); color: var(--text); }
.tb.primary { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.tb.primary:hover:not(:disabled) { background: var(--primary-hover); color: var(--on-primary); }
.tb svg, .rail svg, .ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; color: var(--faint); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--primary) 30%, var(--surface-2)); display: grid; place-items: center; font: 600 12px var(--font); flex: none; }
.cat { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }

/* Rail */
.rail { grid-column: 1; grid-row: 2 / 4; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 2px; }
.rail button { width: 38px; height: 38px; border-radius: var(--radius); display: grid; place-items: center; color: var(--faint); position: relative; }
.rail button:hover { background: var(--hover); color: var(--text); }
.rail button.on { color: var(--primary); background: var(--hover); }
.rail button.on::before { content: ''; position: absolute; left: -5px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--primary); }
.rail .bottom { margin-top: auto; } .rail .last { margin-bottom: 8px; }

.center { grid-column: 2; grid-row: 2; overflow: auto; min-width: 0; position: relative; }
.view { display: none; } .view.on { display: block; }

/* Settings (settings.css) */
.pane { max-width: 1080px; margin: 0 auto; padding: 24px 28px 160px; }
.head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 16px; }
.head h1 { font: 700 28px var(--display); margin: 0; letter-spacing: .02em; }
.set { display: grid; grid-template-columns: 190px 1fr; gap: 24px; }
.set nav { display: flex; flex-direction: column; gap: 2px; }
.set nav button { text-align: left; padding: 6px 10px; border-radius: var(--radius); color: var(--muted); }
.set nav button.on { background: var(--hover); color: var(--text); }
.set h2 { font: 700 21px var(--display); letter-spacing: .02em; margin: 0 0 4px; }
.set .lead { color: var(--muted); margin: 0 0 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.card.narrow { max-width: 520px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label { font: 600 12px var(--font); color: var(--muted); letter-spacing: .04em; }
.field .hint { font-size: 12px; color: var(--faint); }
.field .with-btn { display: flex; gap: 8px; }
.field .with-btn input { flex: 1; min-width: 0; }
.saved { color: var(--primary); }

/* Editor document (editor.html, editor.css) */
.doc { max-width: 780px; margin: 0 auto; padding: 28px 48px 120px; }
.ed { font: 17px/26px var(--prose); }
.ed .l { min-height: 26px; }
.mk { font-family: var(--mono); font-size: 13px; color: var(--faint); }
.fm { font: 13px/26px var(--mono); color: var(--muted); background: var(--surface); border-left: 3px solid var(--border); padding-left: 10px; overflow-wrap: anywhere; }
.fm.fence { color: var(--faint); }
.fm .k { color: var(--info); }
.fm.active { background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
.fm .caret { display: inline-block; width: 2px; height: 16px; background: var(--primary); vertical-align: -3px; margin-left: 1px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.fm-more { display: block; width: 100%; text-align: left; font: 13px/26px var(--mono); color: var(--faint); background: var(--surface); border-left: 3px solid var(--border); padding: 0 0 0 16px; }
.fm-more:hover { color: var(--primary); }
.fm .val.changed { background: color-mix(in srgb, var(--primary) 14%, transparent); border-radius: 3px; }
.h2 { font: 700 24px/34px var(--display); letter-spacing: .02em; margin-top: 18px; }
.h3 { font: 600 21px/30px var(--prose); margin-top: 14px; }
.h3 .sid { font: 600 14px var(--mono); color: var(--primary); }
.fl { font-weight: 600; color: var(--primary); }
.li { padding-left: 22px; text-indent: -22px; }
.callout { margin: 8px 0; padding: 4px 14px 8px; border-left: 3px solid; border-radius: 0 var(--radius) var(--radius) 0; }
.callout .ct { font: 600 12px/24px var(--font); letter-spacing: .06em; text-transform: uppercase; }
.callout.leggi { background: var(--leggi); border-color: var(--leggi-line); } .callout.leggi .ct { color: var(--leggi-line); }
.callout.leggi .tx { font-style: italic; }
.skip { color: var(--faint); font: italic 13px var(--font); padding: 6px 0; }

/* Status bar */
.status { grid-column: 2 / -1; grid-row: 3; display: flex; align-items: center; gap: 16px; padding: 0 12px; font-size: 12px; color: var(--faint);
  background: var(--surface); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
.status .r { margin-left: auto; }

/* Scrim and modal (ui/modal.css) */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5,10,8,.62); display: flex; align-items: flex-start; justify-content: center; padding-top: 6vh; }
.scrim[hidden] { display: none; }
.modal { width: min(880px, calc(100vw - 32px)); max-height: 86vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); flex: none; }
.modal .mh h3 { margin: 0; font: 700 22px var(--display); letter-spacing: .02em; }
.modal .mb { padding: 12px 18px 14px; overflow: auto; min-height: 0; }
.modal .mf { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); flex: none; flex-wrap: wrap; }
.modal .mf .note { margin-right: auto; color: var(--faint); font-size: 12.5px; }


.mock { position: relative; z-index: 60; }

/* Annotation (mockup only) */
.anno { position: fixed; left: 62px; bottom: 36px; width: 410px; z-index: 50; background: var(--surface); border: 1px dashed var(--note); border-radius: 8px; font-size: 12.5px; color: var(--muted); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.anno.closed { display: none; }
.anno h5 { margin: 0; padding: 8px 12px 0; font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--note); display: flex; }
.anno h5 button { margin-left: auto; color: var(--faint); font-size: 12px; }
.anno ul { margin: 6px 0 10px; padding: 0 12px 0 28px; }
.anno li { margin: 2px 0; }
.anno code { font: 11.5px var(--mono); }

/* NEW: template list */
.tgroup { margin-bottom: 20px; }
.tgroup h3 { font: 600 12px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-bottom-width: 0; }
.trow:first-of-type { border-radius: 8px 8px 0 0; } .trow:last-of-type { border-radius: 0 0 8px 8px; border-bottom-width: 1px; }
.trow:only-of-type { border-radius: 8px; }
.trow .tn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.trow .tn b { font: 600 15px var(--font); }
.trow .tm { grid-column: 1; color: var(--faint); font-size: 12.5px; }
.trow .acts { grid-column: 2; grid-row: 1 / 3; display: flex; gap: 6px; align-items: center; }
.chip { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 0 7px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.chip.def { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
.chip.ver { font: 500 11px var(--mono); text-transform: none; letter-spacing: 0; }
.chip.amber { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, var(--border)); }

/* NEW: template editor */
.pane.wide { max-width: 1480px; }
.pane.wide .set { grid-template-columns: 160px 1fr; }
.te-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.te-head .back { color: var(--muted); }
.te-head h2 { margin: 0; }
.banner { margin: 0 0 12px; padding: 8px 12px; border-radius: var(--radius); background: color-mix(in srgb, var(--info) 9%, transparent); border: 1px solid color-mix(in srgb, var(--info) 30%, var(--border)); color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.banner b { color: var(--text); }
.banner .tb { margin-left: auto; }
.te-gen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.te-gen .field { margin: 0; }
.te-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 310px); gap: 16px; align-items: start; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.tabs button { padding: 7px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--primary); font-weight: 600; }
.tabs .n { font-size: 11px; color: var(--faint); margin-left: 3px; }
.rows { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.rh, .rr { display: grid; gap: 8px; align-items: center; padding: 6px 10px; }
.rh { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--border); }
.rr { border-bottom: 1px solid var(--border); }
.rr:last-child { border-bottom: 0; }
.rr.changed { box-shadow: inset 3px 0 0 var(--amber); }
.rr.added { box-shadow: inset 3px 0 0 var(--primary); }
.rr input, .rr select { width: 100%; min-width: 0; padding: 4px 7px; font-size: 13.5px; }
.rr input:disabled, .rr select:disabled { background: transparent; border-color: transparent; color: var(--text); opacity: 1; }
.g-sec { grid-template-columns: 44px minmax(0, 1fr) 118px 112px 150px 30px; }
.g-fld { grid-template-columns: 44px minmax(0, 1fr) 96px 118px 70px 30px; }
.g-box { grid-template-columns: minmax(0, 1fr) 96px minmax(0, 1.3fr) 82px 30px; }
.g-key { grid-template-columns: 44px minmax(0, 1fr) 96px 118px 30px; }
.mv { display: flex; flex-direction: column; }
.mv button { color: var(--faint); font-size: 10px; line-height: 12px; padding: 0 6px; border-radius: 3px; }
.mv button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
.role { font: 500 11.5px var(--font); color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.role .ic { width: 13px; height: 13px; }
.role.custom { color: var(--faint); font-style: italic; }
.pdf { display: flex; flex-wrap: wrap; gap: 3px; }
.tg { font: 500 11.5px var(--font); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--faint); white-space: nowrap; }
.tg.on { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); background: color-mix(in srgb, var(--primary) 9%, transparent); }
.tg.fixed { border-style: dashed; cursor: default; }
.tg:disabled { opacity: .55; }
.del { color: var(--faint); padding: 2px 6px; border-radius: 4px; }
.del:hover:not(:disabled) { color: var(--danger); background: var(--hover); }
.places { display: flex; flex-wrap: wrap; gap: 3px; }
.add { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px dashed var(--border); }
.add input { flex: 1; min-width: 0; }
.sub { color: var(--faint); font-size: 12.5px; margin: 8px 2px 0; }
.lim { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px 14px; }
.lim .field { margin: 0; }
.lim .pair { display: flex; gap: 6px; align-items: center; }
.lim .pair input { width: 80px; }

/* NEW: the starting document preview */
.pv { position: sticky; top: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.pv .ph { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font: 600 12px var(--font); color: var(--muted); letter-spacing: .04em; }
.pv .ph .chip { margin-left: auto; }
.pv .pb { max-height: calc(100vh - 290px); overflow: auto; padding: 10px 14px 14px; font: 14px/22px var(--prose); }
.pv .l { min-height: 22px; overflow-wrap: anywhere; }
.pv .fm { font: 12px/22px var(--mono); }
.pv .h2 { font: 700 19px/28px var(--display); margin-top: 10px; }
.pv .h3 { font: 600 16px/24px var(--prose); margin-top: 6px; }
.pv .fl { font-size: 14px; }
.pv .callout { margin: 4px 0; padding: 2px 10px 4px; }
.pv .callout .ct { font-size: 11px; line-height: 20px; }
.pv .tbl { font: 12px/20px var(--mono); color: var(--muted); }
.pv .hl { background: color-mix(in srgb, var(--amber) 16%, transparent); border-radius: 3px; }
.pv .new { background: color-mix(in srgb, var(--primary) 14%, transparent); border-radius: 3px; }
.pv .out { color: var(--faint); font: italic 12px var(--font); margin-left: 6px; }

/* NEW: the save bar */
.savebar { position: sticky; bottom: 0; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--border)); border-radius: 8px; box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
.savebar .msg { margin-right: auto; color: var(--muted); font-size: 13px; }
.savebar .msg b { color: var(--amber); }

/* NEW: dialogs */
.modal.sm { width: min(560px, calc(100vw - 32px)); }
.chg { list-style: none; margin: 0 0 12px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); }
.chg li { padding: 7px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
.chg li:last-child { border-bottom: 0; }
.chg .k { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; width: 62px; flex: none; }
.chg .k.a { color: var(--primary); } .chg .k.c { color: var(--amber); } .chg .k.r { color: var(--danger); }
.chk { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
.chk input { margin-top: 3px; }
.chk small { display: block; color: var(--faint); }
.mb p { margin: 0 0 10px; color: var(--muted); }
.mb .field select, .mb .field input { width: 100%; }
.seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { flex: 1; padding: 6px 8px; color: var(--muted); }
.seg button.on { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--text); font-weight: 600; }

/* NEW: editor top bar template chip */
.tpl-chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--amber) 50%, var(--border)); color: var(--amber); white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.tpl-chip:hover { background: color-mix(in srgb, var(--amber) 10%, transparent); }

@media (max-width: 980px) {
  .te-body { grid-template-columns: 1fr; }
  .pv { position: static; }
  .pv .pb { max-height: 360px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 0 1fr; }
  .rail { display: none; }
  .logo { width: 40px; }
  .hide-narrow { display: none !important; }
  .pane { padding: 16px 16px 160px; }
  .set { grid-template-columns: 1fr; gap: 12px; }
  .set nav { flex-direction: row; flex-wrap: wrap; }
  .set nav button { padding: 4px 8px; font-size: 13px; }
  .doc { padding: 16px 16px 120px; }
  .te-gen { grid-template-columns: 1fr; }
  .rows { overflow-x: auto; }
  .rh, .rr { min-width: 620px; }
  .trow { grid-template-columns: 1fr; }
  .trow .acts { grid-column: 1; grid-row: auto; flex-wrap: wrap; }
  .scrim { padding-top: 2vh; }

/* NEW (game systems). The PDF is paper in both themes, so the box keeps its own ink. */
:root { --paper: #ffffff; --ink: #141414; --ink-2: #5d5d5d; --mark: #b3202f; }
.g-gf { grid-template-columns: 44px minmax(0, 1fr) 150px minmax(0, 1.2fr) 128px 104px 30px; }
.g-tb { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)) 30px; }
.opt { font: 12.5px var(--font); color: var(--muted); text-align: left; padding: 3px 7px; border-radius: 4px; border: 1px dashed var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt:hover:not(:disabled) { color: var(--text); border-color: var(--primary); }
.opt.on { border-style: solid; border-color: var(--primary); color: var(--text); }
.optp { padding: 10px 14px 12px 62px; border-bottom: 1px solid var(--border); background: var(--surface-2); display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
.optp .field { margin: 0; }
.optp .field input, .optp .field select { width: 100%; }
.optp .say { grid-column: 1 / -1; font-size: 12.5px; color: var(--faint); margin: 0; }
.optp .say code { color: var(--text); }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.kind { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.kind.on { border-color: var(--primary); color: var(--text); background: color-mix(in srgb, var(--primary) 10%, transparent); font-weight: 600; }
.kindbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 10px; }
.kindbar .field { margin: 0; }
.md { font: 12px/19px var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.md b { color: var(--info); font-weight: 500; }
.pv .pb.paper { background: color-mix(in srgb, var(--bg) 70%, var(--surface)); padding: 14px; font: inherit; }

/* The scene box as the PDF draws it (threat-box in avventura.typ) */
.tbox { background: var(--paper); color: var(--ink); border: 1.3px solid var(--ink); padding: 9px 12px 10px; font: 12.5px/1.38 var(--prose); break-inside: avoid; }
.tbox .tn { font: 700 19px/1.1 var(--display); letter-spacing: .01em; }
.tbox .ts { color: var(--ink-2); font-size: 11.5px; margin-bottom: 4px; }
.tbox .tq { font-style: italic; margin: 2px 0 4px; }
.tbox .r { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.tbox .r > b:first-child { font-weight: 600; }
.tbox .p { margin-top: 3px; }
.tbox .p b { font-weight: 600; }
.tbox .bx { display: inline-flex; gap: 2.5px; margin-right: 7px; }
.tbox .bx i { width: 10px; height: 10px; border: 1px solid var(--ink); display: inline-block; }
.tbox .bx i.m { border-color: var(--mark); box-shadow: inset 0 0 0 1.5px var(--paper), inset 0 0 0 10px color-mix(in srgb, var(--mark) 18%, transparent); }
.tbox .bx i.v { width: auto; min-width: 12px; height: 12px; font: 600 8px/10px var(--font); text-align: center; padding: 0 2px; }
.tbox .st { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border: 1px solid var(--ink); margin-top: 5px; }
.tbox .st div { text-align: center; border-left: 1px solid var(--ink); padding: 1px 2px 2px; min-width: 0; }
.tbox .st div:first-child { border-left: 0; }
.tbox .st small { display: block; font: 600 8.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbox .st span { font: 600 13px var(--display); }
.tbox table { border-collapse: collapse; width: 100%; margin-top: 4px; font-size: 11.5px; }
.tbox th { text-align: left; font: 600 8.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--ink); padding: 1px 4px 1px 0; }
.tbox td { padding: 2px 4px 1px 0; vertical-align: top; border-bottom: .5px solid #c9c9c9; }
.tbox .tok { display: inline-flex; gap: 2px; vertical-align: -1px; margin-left: 3px; }
.tbox .tok i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); display: inline-block; }
.tbox .ck { list-style: none; margin: 2px 0 0; padding: 0; }
.tbox .ck li { padding-left: 15px; text-indent: -15px; }
.tbox .ck li::before { content: '○'; display: inline-block; width: 15px; text-indent: 0; }
.tbox .wl { display: inline-block; min-width: 54px; border-bottom: 1px solid var(--ink); height: 11px; }
.tbox .clk { width: 30px; height: 30px; vertical-align: middle; }
.tbox .more { margin-top: 5px; color: var(--ink-2); font-size: 11px; font-style: italic; }
.tbox.plain .ts { color: var(--mark); }

/* Gallery of every built-in */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }
.gal h4 { margin: 0 0 6px; font: 600 12px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; gap: 6px; }
.gal h4 span { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; }
.gal .g { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* Editor problems (state 9) */
.sq { text-decoration: underline wavy var(--amber); text-underline-offset: 3px; }
.sq.err { text-decoration-color: var(--danger); }
.probs { margin-top: 14px; font: 13px var(--font); }
.probs li { margin: 4px 0; }
.probs .w { color: var(--amber); font-weight: 600; } .probs .e { color: var(--danger); font-weight: 600; }
.slash { margin: 6px 0 0 22px; width: min(360px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); font: 13.5px var(--font); overflow: hidden; }
.slash div { padding: 6px 12px; display: flex; justify-content: space-between; gap: 10px; }
.slash div.on { background: var(--hover); }
.slash small { color: var(--faint); }
.slash .hd { font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 8px; }
@media (max-width: 760px) { .optp { padding-left: 14px; } }

/* ---------- Reading values ---------- */
const SEP = /\s+·\s+/;
function tableRow(sys, table, key) {
  const t = sys.tables.find(x => x.name === table); if (!t) return null;

function count(sys, f, v, vals) {
  const o = f.o;

  if (o.count === 'table') {
    const choice = sys.kinds.flatMap(k => k.fields).find(x => x.block === 'choice' && x.o.table === o.table);
    const r = choice && tableRow(sys, o.table, vals[choice.key]);

}
const boxes = (n, group, marks = [], values) => {

    h += '<span class="bx">';

};
function clock(n) {

}
const tokens = n => n ? `<span class="tok" title="${n}">${'<i></i>'.repeat(+n)}</span>` : '';
const asList = v => Array.isArray(v) ? v : String(v || '').split(SEP).filter(Boolean);
const split1 = s => { const m = s.match(/^(.*?)\s*\((.*)\)\s*$/); return m ? [m[1], m[2]] : [s, '']; };

function cell(sys, f, v, vals) {
  const k = `<b>${esc(f.key)}</b>`;

    case 'text': return `<div class="r">${k}<span>${esc(v)}</span></div>`;
    case 'number': return f.o.line ? `<div class="r">${k}<span class="wl"></span><span>/ ${esc(v)}</span></div>` : `<div class="r">${k}<span>${esc(v)}</span></div>`;

      const r = f.o.also && tableRow(sys, f.o.table, v);

    }
    case 'stats': {
      const labels = String(f.o.labels || '').split(SEP).filter(Boolean);
      const got = Object.fromEntries(asList(v).map(x => { const m = x.match(/^(\S+(?:\s\S+)*?)\s+(\S.*)$/); return m ? [m[1], m[2]] : [x, '']; }));

    }

    }

    body = `<div class="te-body"><div>
      <div class="kinds">${draft.kinds.map((k, i) => `<button class="kind${i === kindIx ? ' on' : ''}" data-kind="${i}">${esc(k.name)}</button>`).join('')}${ro ? '' : '<button class="tb" id="addKind">+ Kind</button>'}</div>
      <div class="kindbar"><div class="field"><label for="kName">«Tipo» value</label><input id="kName" value="${esc(kind.name)}" ${d}></div>
        <span class="sub" style="margin:0 0 6px">A sheet with <code>- **Tipo:** ${esc(kind.name)}</code> is read with these fields.</span></div>
      <div class="rows"><div class="rh g-gf"><span></span><span>Key in the sheet</span><span>Block</span><span>Options</span><span>In the scene box</span><span>Needed</span><span></span></div>${rows}
        ${ro ? '' : '<div class="add"><input id="newKey" placeholder="New key, e.g. Paura"><button class="tb line" id="addField">Add field</button></div>'}</div>
      <p class="sub">The full sheet under «Schede» prints every field, boxes and clocks included. «Tipo» and the sheet's name are always there.</p>
    </div>
    <aside class="pv"><div class="ph">Example: scene box in the PDF<span class="chip">${esc(kind.name)}</span></div>
      <pre class="md">${sheetMd(kind, kind.sample)}</pre>
      <div class="pb paper">${threatBox(draft, kind, kind.sample)}</div></aside></div>`;
  } else {
    body = draft.tables.map((t, ti) => `<div class="field" style="margin-bottom:6px"><label>Table</label><input value="${esc(t.name)}" ${d} style="max-width:260px"></div>
      <div class="rows" style="margin-bottom:16px;--cols:${t.cols.length}">
        <div class="rh g-tb">${t.cols.map(c => `<span>${esc(c)}</span>`).join('')}<span></span></div>
        ${t.rows.map((r, ri) => `<div class="rr g-tb${r.added ? ' added' : ''}">${t.cols.map((c, ci) => `<input value="${esc(r[ci])}" ${d} aria-label="${esc(c)}">`).join('')}<button class="del" ${d} aria-label="Remove row">✕</button></div>`).join('')}
        ${ro ? '' : `<div class="add"><button class="tb line" data-addrow="${ti}">Add row</button><button class="tb" >Add column</button></div>`}
      </div>`).join('') + (draft.tables.length ? '' : '<p class="sub">No tables: every count is written in the sheet.</p>') +
      (ro ? '' : '<button class="tb line" id="addTable">New table</button>') +
      '<p class="sub">The first column is what the sheet writes (a grade, a word); the other columns are numbers that boxes, clocks and rows can use. Kulthos: «Grado: Straordinaria» gives 6 wounds in counters of 3 and 2 afflictions.</p>';
  }
  $('#setBody').innerHTML = `
    <div class="te-head"><button class="tb back" id="back">‹ Game systems</button><h2>${esc(draft.name)}</h2>${ro ? '<span class="chip">Built-in</span>' : ''}<span class="chip">${draft.used ? draft.used + ' projects' : 'no projects'}</span></div>
    ${ro ? `<div class="banner"><span>Built-in systems can't be changed. <b>Duplicate</b> it to make your own.</span><button class="tb primary" id="dupB">Duplicate</button></div>` : ''}
    <div class="te-gen"><div class="field"><label for="sName">Name</label><input id="sName" value="${esc(draft.name)}" ${d}><span class="hint">What <code>sistema:</code> writes; any case.</span></div>
      <div class="field"><label>Based on</label><input value="${esc(draft.from || '—')}" disabled></div></div>
    ${tabsH}${body}
    ${!ro && nChanges ? `<div class="savebar"><span class="msg"><b>Unsaved changes.</b> Saving changes ${draft.used} project${draft.used === 1 ? '' : 's'} at once.</span><button class="tb line" id="disc">Discard</button><button class="tb primary" id="save">Save</button></div>` : ''}`;
  wireEditor();
}
function wireEditor() {
  $('#back').onclick = () => { draft = saved = null; renderList(); };
  if ($('#dupB')) $('#dupB').onclick = () => { const copy = { ...clone(draft), id: 'c' + Date.now(), name: `${draft.name} (copia)`, builtin: false, from: draft.name, used: 0 }; SYS.push(copy); openSys(copy.id); renderEditor(); };
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderEditor(); });
  $$('[data-kind]').forEach(b => b.onclick = () => { kindIx = +b.dataset.kind; openOpt = null; renderEditor(); });
  const kind = draft.kinds[kindIx];
  $$('.rr[data-i]').forEach(r => {
    const f = kind.fields[+r.dataset.i];
    r.querySelectorAll('[data-k]').forEach(el => el.onchange = () => {
      const k = el.dataset.k, old = f[k]; f[k] = el.value;
      if (k === 'key' && kind.sample) { kind.sample.v[el.value] = kind.sample.v[old]; }
      if (k === 'block') { f.o = { boxes: { count: 'written' }, list: { style: 'line' }, clock: { count: 'fixed', n: 4 }, choice: { table: draft.tables[0]?.name }, flag: { word: f.key.toLowerCase() } }[el.value] || {}; openOpt = +r.dataset.i; }
      renderEditor();
    });
  });
  $$('[data-opt]').forEach(b => b.onclick = () => { openOpt = openOpt === +b.dataset.opt ? null : +b.dataset.opt; renderEditor(); });
  $$('.optp [data-o]').forEach(el => el.onchange = () => {
    const f = kind.fields[openOpt]; f.o[el.dataset.o] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.o === 'table' && f.block === 'boxes') f.o.col = (draft.tables.find(t => t.name === el.value)?.cols || [])[1];
    renderEditor();
  });
  $$('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [kind.fields[i - 1], kind.fields[i]] = [kind.fields[i], kind.fields[i - 1]]; openOpt = null; renderEditor(); });
  $$('[data-dn]').forEach(b => b.onclick = () => { const i = +b.dataset.dn; [kind.fields[i + 1], kind.fields[i]] = [kind.fields[i], kind.fields[i + 1]]; openOpt = null; renderEditor(); });
  $$('[data-rm]').forEach(b => b.onclick = () => { kind.fields.splice(+b.dataset.rm, 1); openOpt = null; renderEditor(); });
  if ($('#addField')) $('#addField').onclick = () => { const k = $('#newKey').value.trim(); if (!k) return; kind.fields.push({ ...F(k, 'text', 'row'), added: true }); kind.sample.v[k] = '…'; openOpt = kind.fields.length - 1; renderEditor(); };
  if ($('#addKind')) $('#addKind').onclick = () => { draft.kinds.push({ name: 'Nuovo tipo', fields: [F('Descrizione', 'text', 'row')], sample: { name: 'Esempio', v: { Descrizione: '…' } } }); kindIx = draft.kinds.length - 1; renderEditor(); };
  if ($('#kName')) $('#kName').onchange = e => { kind.name = e.target.value; renderEditor(); };
  if ($('#sName')) $('#sName').onchange = e => { draft.name = e.target.value; renderEditor(); };
  $$('[data-addrow]').forEach(b => b.onclick = () => { const t = draft.tables[+b.dataset.addrow]; const r = t.cols.map(() => ''); r.added = true; t.rows.push(r); renderEditor(); });
  if ($('#addTable')) $('#addTable').onclick = () => { draft.tables.push(T('Nuova tabella', ['Parola', 'Valore'], [['', '']])); renderEditor(); };
  if ($('#disc')) $('#disc').onclick = () => { draft = clone(saved); renderEditor(); };
  if ($('#save')) $('#save').onclick = () => { const i = SYS.findIndex(s => s.id === draft.id); SYS[i] = clone(draft); saved = clone(draft); renderEditor(); };
}

/* ---------- 6 · Gallery ---------- */
function renderGallery() {
  $('.pane').classList.add('wide');
  const all = SYS.filter(s => s.builtin);
  $('#setBody').innerHTML = `<h2>Every built-in, as the PDF draws it</h2>
    <p class="lead">One made-up sheet per kind, drawn by the same rules as the scene box. Mockup page only; in the app each system shows its own example in its editor.</p>
    <div class="gal">${all.map(s => s.kinds.map(k => `<div class="g"><h4>${esc(s.name)} <span>· ${esc(k.name)}</span></h4>${threatBox(s, k, k.sample)}</div>`).join('')).join('')}</div>`;
}

/* ---------- 7 · Template picker ---------- */
function renderPicker() {
  $('.pane').classList.add('wide');
  $$('.set nav button').forEach(b => b.classList.remove('on')); $('#navDocs').classList.add('on');
  const opts = [['', 'None'], ...SYS.filter(s => !s.builtin).map(s => [s.name, s.name + ' (yours)']), ...SYS.filter(s => s.builtin).map(s => [s.name, s.name])];
  $('#setBody').innerHTML = `<div class="te-head"><button class="tb back">‹ Document templates</button><h2>Avventura Kulthos</h2><span class="chip ver">v2</span></div>
    <div class="te-gen"><div class="field"><label>Name</label><input value="Avventura Kulthos"></div><div class="field"><label>Category</label><select><option>Adventures and one-shots</option></select></div>
      <div class="field"><label for="tSys">Game system</label><select id="tSys"><optgroup label="Yours">${opts.slice(1, 1 + SYS.filter(s => !s.builtin).length).map(([v, l]) => `<option${v === 'Kulthos (casa)' ? ' selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>
        <optgroup label="Built-in">${SYS.filter(s => s.builtin).map(s => `<option>${esc(s.name)}</option>`).join('')}</optgroup><option>None</option></select>
        <span class="hint">New projects get it in <code>sistema:</code>. Sheet kinds and their boxes come from Settings → Game systems.</span></div></div>
    <div class="banner" style="margin-top:12px"><span>The template no longer lists the threat keys (Grado, Ferite, Afflizioni, Branco, Talenti) under «Schede»: they moved to the Kulthos system. «Schede» keeps only <b>Tipo</b> and <b>Pregenerati</b>.</span></div>`;
}

/* ---------- 8 · Delete ---------- */
let backFocus = null;
function dialog(title, body, foot) {
  backFocus = document.activeElement;
  $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = body; $('#dlgFoot').innerHTML = foot;
  $('#scrim').hidden = false; ($('#dlgFoot .primary') || $('#dlgX')).focus();
}
function closeDialog() { $('#scrim').hidden = true; if (backFocus && document.contains(backFocus)) backFocus.focus(); }
$('#dlgX').onclick = closeDialog;
$('#scrim').onclick = e => { if (e.target.id === 'scrim') closeDialog(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeDialog(); });
function openDelete(id) {
  const s = sysOf(id);
  dialog(`Delete ${s.name}?`,
    `<p>${s.used ? `<b>${s.used} projects</b> and <b>1 template</b> name it in <code>sistema:</code>.` : 'No project or template uses it.'}</p>
     ${s.used ? `<p>Their text stays as it is. Until they name another system, their sheets print as plain «Key: value» lines with no boxes, and the checks show a warning: «Kulthos (casa)» isn't one of your game systems.</p>` : ''}
     <p>This can't be undone; duplicate it first if you might want it back.</p>`,
    `<button class="tb line" id="dCancel">Cancel</button><button class="tb primary" id="dDel" style="background:var(--danger)">Delete</button>`);
  $('#dCancel').onclick = closeDialog;
  $('#dDel').onclick = () => { SYS = SYS.filter(x => x.id !== id); closeDialog(); renderList(); };
}

/* ---------- 9 · Editor ---------- */
function renderDoc() {
  $('#ed').innerHTML = `<div class="l fm fence">---</div>
    <div class="l fm"><span class="k">titolo:</span> Lex Umbræ al Molo</div><div class="l fm"><span class="k">sistema:</span> Vileborn</div><div class="l fm fence">---</div>
    <div class="l h2"><span class="mk">## </span>Schede</div>

    <div class="l li">- <span class="fl">Approcci:</span> Forza 6 · Sotterfugio 5 · Precisione 6 · Ragione 4 · <span class="sq">Influnza 5</span> · Volontà 7</div>
    <div class="l li">- <span class="fl">Colpi:</span> <span class="sq">sei</span></div>

    <ul class="probs">
      <li><span class="w">Warning</span> · Il Balivo Cavo · Approcci: «Influnza» isn't one of Forza, Sotterfugio, Precisione, Ragione, Influenza, Volontà.</li>
      <li><span class="w">Warning</span> · Il Balivo Cavo · Colpi: write a number of boxes, like <code>6</code>, or <code>6 (3)</code> to mark the 3rd. The box prints the text instead.</li>

const anno = n => { const [h, l] = NOTES[n]; $('#annoH').textContent = `Mockup note · ${h}`; $('#annoL').innerHTML = l.map(x => `<li>${x}</li>`).join(''); };
function setState(n) {
  closeDialog();
  state = n;
  $$('.mock [data-state]').forEach(b => b.classList.toggle('on', +b.dataset.state === n));
  anno(n);
  view = n === 9 ? 'editor' : 'settings';
  renderChrome();
  $$('.set nav button').forEach(b => b.classList.remove('on')); $('#navSys').classList.add('on');
  if (n === 1) return renderList();
  if (n === 2) { openSys('vileborn'); return renderEditor(); }
  if (n === 3) { openSys('kulcasa'); saved = clone(draft); saved.kinds[0].fields.splice(5, 1); openOpt = 3; return renderEditor(); }
  if (n === 4) { openSys('kulcasa'); tab = 'tables'; return renderEditor(); }
  if (n === 5) { openSys('outgunned'); kindIx = 2; openOpt = 0; return renderEditor(); }
  if (n === 6) return renderGallery();
  if (n === 7) return renderPicker();
  if (n === 8) { renderList(); return openDelete('kulcasa'); }
  if (n === 9) return renderDoc();
}
$$('.mock [data-state]').forEach(b => b.onclick = () => setState(+b.dataset.state));
$('#mReset').onclick = () => { seed(); setState(state); };
$('#mTheme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
$('#mNotes').onclick = () => $('#anno').classList.toggle('closed');
$('#annoX').onclick = () => $('#anno').classList.add('closed');
seed();
setState(1);
</script>
