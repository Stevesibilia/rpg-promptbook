{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# The board's images and tracks (asset-board design decision 17). Kept when
# the release is uninstalled: removing it is a separate, deliberate step.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rpg-promptbook.dataClaimName" . }}
  labels:
    {{- include "rpg-promptbook.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
