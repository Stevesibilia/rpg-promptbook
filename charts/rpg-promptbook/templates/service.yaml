apiVersion: v1
kind: Service
metadata:
  name: {{ include "rpg-promptbook.fullname" . }}
  labels:
    {{- include "rpg-promptbook.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rpg-promptbook.selectorLabels" . | nindent 4 }}
